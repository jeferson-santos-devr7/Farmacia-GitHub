name: Compilar e testar

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          # Senha fictícia usada apenas no contêiner temporário do CI.
          MYSQL_ROOT_PASSWORD: ci_only_test_password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      FARMACIA_TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/farmacia_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&sslMode=DISABLED
      FARMACIA_TEST_MYSQL_USER: root
      FARMACIA_TEST_MYSQL_PASSWORD: ci_only_test_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar e testar com MySQL
        run: mvn --batch-mode --no-transfer-progress -Djava.awt.headless=true clean verify
